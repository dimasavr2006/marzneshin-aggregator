name: Proxy Pool Tests

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'app/**'
      - 'tests/**'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'app/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run proxy pool tests
        run: |
          python -m pytest tests/test_parsers.py tests/test_chain_proxy.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: marzneshin-aggregator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm marzneshin-aggregator:test python3 -c "from app.utils.share import generate_subscription; print('Import OK')"
